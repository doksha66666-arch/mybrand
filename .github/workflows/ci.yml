name: MYBRAND CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Express API lives at the repository root; the remaining entries
        # are independently deployable frontend applications.
        project: ['.', web, admin-dashboard, merchant-dashboard]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify all backend JavaScript
        if: matrix.project == '.'
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Build frontend
        if: matrix.project != '.'
        run: npm run build
