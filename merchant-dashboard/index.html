<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYBRAND - لوحة التاجر</title>
    <style>
      @media (max-width:900px){
        html,body,#root{width:100%!important;max-width:100%!important;min-width:0!important;overflow-x:hidden!important}
        .merchant-content,.merchant-content *{box-sizing:border-box!important}
        .merchant-content{width:100%!important;max-width:100%!important;overflow-x:hidden!important;padding-left:8px!important;padding-right:8px!important}
        .merchant-content>div{width:100%!important;max-width:100%!important;margin:0!important;min-width:0!important}
        .merchant-content>div>.grid{width:100%!important;max-width:100%!important;min-width:0!important;grid-template-columns:minmax(0,1fr)!important}
        .merchant-content>div>.grid>article{width:100%!important;max-width:100%!important;min-width:0!important;padding:8px!important;overflow:hidden!important}
        .merchant-content>div>.grid>article>.items{width:100%!important;max-width:100%!important;min-width:0!important}
        .merchant-content>div>.grid>article>.items>.item{width:100%!important;max-width:100%!important;min-width:0!important;padding:7px!important;margin:0!important;overflow:hidden!important}
        .merchant-content>div>.grid>article>.items>.item .itemMain{display:grid!important;grid-template-columns:44px minmax(0,1fr)!important;gap:6px!important;width:100%!important;max-width:100%!important;min-width:0!important}
        .merchant-content>div>.grid>article>.items>.item .imageWrap{width:44px!important;height:44px!important;min-width:44px!important;max-width:44px!important}
        .merchant-content>div>.grid>article>.items>.item .itemBody{width:100%!important;max-width:100%!important;min-width:0!important;overflow:hidden!important}
        .merchant-content>div>.grid>article>.items>.item .nameRow{display:grid!important;grid-template-columns:minmax(0,1fr) 36px!important;gap:4px!important;width:100%!important;min-width:0!important}
        .merchant-content>div>.grid>article>.items>.item .productName{font-size:12px!important;line-height:1.25!important;margin:1px 0 3px!important;overflow-wrap:anywhere!important;word-break:break-word!important;max-width:100%!important}
        .merchant-content>div>.grid>article>.items>.item .qty{width:36px!important;min-width:36px!important;max-width:36px!important;padding:3px 1px!important}
        .merchant-content>div>.grid>article>.items>.item .details{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:4px!important;width:100%!important;max-width:100%!important;min-width:0!important;overflow:hidden!important}
        .merchant-content>div>.grid>article>.items>.item .detail{width:100%!important;max-width:100%!important;min-width:0!important;padding:4px!important;overflow:hidden!important;overflow-wrap:anywhere!important;word-break:break-word!important}
        .merchant-content>div>.grid>article>.items>.item .detail span,.merchant-content>div>.grid>article>.items>.item .detail b{display:block!important;max-width:100%!important;min-width:0!important;overflow-wrap:anywhere!important;word-break:break-word!important}
        .merchant-content>div>.grid>article>.items>.item .notes,.merchant-content>div>.grid>article>.items>.item .noNotes{width:100%!important;max-width:100%!important;min-width:0!important;overflow:hidden!important;overflow-wrap:anywhere!important}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
