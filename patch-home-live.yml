name: Patch homepage live hero

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch homepage hero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          home = Path('web/src/pages/HomePage.jsx')
          text = home.read_text(encoding='utf-8')
          replacement = r'''function HomeHero({banners}){const [index,setIndex]=useState(0);const [liveStream,setLiveStream]=useState(null);const [liveStatus,setLiveStatus]=useState('connecting');const [muted,setMuted]=useState(true);const videoRef=React.useRef(null);const peerRef=React.useRef(null);const live=useMemo(()=>Array.isArray(banners)?banners.filter(b=>b?.image):[],[banners]);useEffect(()=>{if(live.length<2)return;const id=setInterval(()=>setIndex(i=>(i+1)%live.length),5000);return()=>clearInterval(id)},[live.length]);useEffect(()=>{let cancelled=false;const load=async()=>{try{const {data}=await api.get('/live/active');if(cancelled)return;const stream=data?.stream||data?.streams?.[0]||null;setLiveStream(stream?.playbackUrl?stream:null)}catch{if(!cancelled)setLiveStream(null)}};load();const id=setInterval(load,5000);return()=>{cancelled=true;clearInterval(id)}},[]);useEffect(()=>{if(!liveStream?.playbackUrl||!videoRef.current)return undefined;let cancelled=false;const start=async()=>{try{setLiveStatus('connecting');peerRef.current?.close();const video=videoRef.current;const peer=new RTCPeerConnection({bundlePolicy:'max-bundle'});peer.addTransceiver('video',{direction:'recvonly'});peer.addTransceiver('audio',{direction:'recvonly'});peer.ontrack=({streams,track})=>{if(cancelled)return;const source=streams?.[0];if(source){video.srcObject=source}else{const media=video.srcObject instanceof MediaStream?video.srcObject:new MediaStream();media.addTrack(track);video.srcObject=media}video.muted=true;video.play().catch(()=>{})};peer.onconnectionstatechange=()=>{if(cancelled)return;if(peer.connectionState==='connected')setLiveStatus('live');else if(['failed','disconnected','closed'].includes(peer.connectionState))setLiveStatus('failed')};await peer.setLocalDescription(await peer.createOffer());await new Promise(resolve=>{if(peer.iceGatheringState==='complete')return resolve();const timer=setTimeout(resolve,2500);peer.onicegatheringstatechange=()=>{if(peer.iceGatheringState==='complete'){clearTimeout(timer);resolve()}}});const response=await fetch(liveStream.playbackUrl,{method:'POST',headers:{'Content-Type':'application/sdp'},body:peer.localDescription?.sdp||''});if(!response.ok)throw new Error(`WHEP ${response.status}`);await peer.setRemoteDescription({type:'answer',sdp:await response.text()});peerRef.current=peer;setLiveStatus('live')}catch{if(!cancelled)setLiveStatus('failed')}};start();return()=>{cancelled=true;peerRef.current?.close();peerRef.current=null;if(videoRef.current)videoRef.current.srcObject=null}},[liveStream?.playbackUrl]);useEffect(()=>()=>{peerRef.current?.close()},[]);if(liveStream)return <section className="home-hero home-hero-live-stream" aria-label="البث المباشر"><div className="home-live-player"><video ref={videoRef} autoPlay playsInline muted={muted} className="home-live-video"/><div className="home-live-shade"/><div className="home-live-top"><span className="home-live-badge">● مباشر الآن</span><span className="home-live-viewers">👁 {Number(liveStream.viewerCount||0).toLocaleString('ar-EG')}</span></div><div className="home-live-center">{liveStatus==='failed'?<><strong>تعذر تشغيل البث</strong><small>جاري إعادة الاتصال...</small></>:liveStatus!=='live'?<><strong>جاري فتح البث المباشر...</strong><small>انتظر لحظات</small></>:null}</div><div className="home-live-bottom"><div><span className="home-live-kicker">MYBRAND</span><strong>{liveStream.title||'عرض MYBRAND نيو'}</strong><small>{liveStream.description||'شاهد البث المباشر الآن'}</small></div><button type="button" className="home-live-mute" onClick={()=>{const next=!muted;setMuted(next);if(videoRef.current)videoRef.current.muted=next}} aria-label={muted?'تشغيل الصوت':'كتم الصوت'}>{muted?'🔇':'🔊'}</button></div></div></section>;if(!live.length)return <section className="home-hero"><Link to="/categories" className="hero-side hero-side-one"><span className="hero-kicker">اختيارات MYBRAND</span><strong>إطلالتك تبدأ من هنا</strong><small>تشكيلة جديدة كل أسبوع</small><span className="hero-cta">تسوق الآن</span></Link><Link to="/categories" className="hero-main"><div className="hero-glow"/><span className="hero-kicker">MYBRAND EDIT</span><h1>اكتشف الجديد<br/><b>بأسلوبك الخاص</b></h1><p>منتجات مختارة، عروض يومية وتجربة تسوق أسهل.</p><span className="hero-cta">اكتشف المجموعة</span></Link><Link to="/categories" className="hero-side hero-side-two"><span className="hero-kicker">عروض اليوم</span><strong>خصومات حتى ٧٠٪</strong><small>لفترة محدودة</small><span className="hero-cta">شاهد العروض</span></Link></section>;const b=live[index];const target=b.buttonLink||'/categories';return <section className="home-hero home-hero-live"><Link to={target} className="hero-live-main"><img src={b.image} alt={b.titleAr||'MYBRAND'} loading="eager"/><div className="hero-live-overlay"><span className="hero-kicker">MYBRAND</span><h1>{b.titleAr}</h1>{b.subtitleAr&&<p>{b.subtitleAr}</p>}{b.buttonTextAr&&<span className="hero-cta">{b.buttonTextAr}</span>}</div></Link>{live.length>1&&<div className="hero-dots" aria-label="شرائح البنر">{live.map((_,i)=><button key={i} type="button" className={i===index?'active':''} onClick={e=>{e.preventDefault();setIndex(i)}} aria-label={`البنر ${i+1}`}/>)}</div>}</section>}'''
          pattern = re.compile(r'function HomeHero\(\{banners\}\)\{.*?\}\nfunction CategoryImages', re.S)
          new_text, count = pattern.subn(replacement + '\nfunction CategoryImages', text, count=1)
          if count != 1:
              raise SystemExit('HomeHero function not found; aborting without changes')
          home.write_text(new_text, encoding='utf-8')

          css = Path('web/src/pages/HomePagePremium.css')
          ctext = css.read_text(encoding='utf-8')
          marker = '/* MYBRAND live hero */'
          if marker not in ctext:
              ctext += '''\n/* MYBRAND live hero */\n.home-hero-live-stream{display:block;max-width:1320px;padding:0 28px;margin:28px auto 0;direction:rtl}.home-live-player{position:relative;overflow:hidden;width:100%;aspect-ratio:16/7;min-height:300px;background:#080808;border-radius:22px;box-shadow:0 14px 40px rgba(17,17,17,.12)}.home-live-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#080808}.home-live-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 34%,transparent 58%,rgba(0,0,0,.74));pointer-events:none}.home-live-top{position:absolute;top:18px;right:18px;left:18px;display:flex;align-items:center;justify-content:space-between;color:#fff;z-index:2}.home-live-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,59,48,.94);font-family:'Cairo';font-size:12px;font-weight:800}.home-live-viewers{font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.42);backdrop-filter:blur(8px)}.home-live-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-align:center;z-index:1;pointer-events:none}.home-live-center strong{font-family:'Cairo';font-size:22px}.home-live-center small{font-size:12px;opacity:.88}.home-live-bottom{position:absolute;right:20px;left:20px;bottom:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;color:#fff;z-index:2}.home-live-bottom>div{display:flex;flex-direction:column;gap:3px}.home-live-kicker{font-size:10px;font-weight:900;letter-spacing:.6px}.home-live-bottom strong{font-family:'Cairo';font-size:24px}.home-live-bottom small{font-size:12px;opacity:.9}.home-live-mute{width:42px;height:42px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(8px)}@media (max-width:700px){.home-hero-live-stream{display:block;margin-top:14px;padding:0 14px}.home-live-player{aspect-ratio:16/10;min-height:0;border-radius:14px}.home-live-top{top:12px;right:12px;left:12px}.home-live-badge{font-size:10px;padding:6px 10px}.home-live-viewers{font-size:10px;padding:6px 9px}.home-live-bottom{right:13px;left:13px;bottom:13px}.home-live-bottom strong{font-size:18px}.home-live-bottom small{font-size:10px}.home-live-mute{width:38px;height:38px}.home-live-center strong{font-size:17px}.home-live-center small{font-size:10px}}\n'''
              css.write_text(ctext, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/pages/HomePage.jsx web/src/pages/HomePagePremium.css
          git commit -m "feat(live): show active stream in homepage hero"
          git push
